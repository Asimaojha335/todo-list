<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A to-do list with priorities, due dates, search and filters, built with HTML, CSS and JavaScript.">
  <title>To-Do List</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><span></span><span></span></div>

  <main class="shell">
    <header class="top">
      <div>
        <p class="eyebrow" id="today"></p>
        <h1>To-Do List</h1>
        <p class="api-note">Backed by a real Node/Express-style API and MongoDB. This is a shared public demo list — anyone viewing this page can see and edit these tasks.</p>
      </div>
      <button id="themeBtn" class="icon-btn" type="button" aria-label="Toggle dark mode">
        <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <section class="panel">
      <div class="progress-wrap">
        <div class="progress-text"><span id="progressLabel">No tasks yet</span><strong id="progressPct">0%</strong></div>
        <div class="bar" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><span id="barFill"></span></div>
      </div>

      <form id="taskForm" class="add" novalidate>
        <label for="taskInput" class="sr-only">New task</label>
        <input id="taskInput" type="text" placeholder="Add a new task..." maxlength="120" autocomplete="off">
        <label for="priority" class="sr-only">Priority</label>
        <select id="priority" aria-label="Priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
        <label for="due" class="sr-only">Due date</label>
        <input id="due" type="date" aria-label="Due date">
        <button type="submit" class="btn-add">Add</button>
      </form>
      <p id="formError" class="form-error" role="alert"></p>
      <p id="apiError" class="api-error" role="alert" hidden></p>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" data-filter="all" type="button">All</button>
          <button class="filter" data-filter="active" type="button">Active</button>
          <button class="filter" data-filter="done" type="button">Done</button>
        </div>
        <label class="sr-only" for="search">Search tasks</label>
        <input id="search" class="search" type="search" placeholder="Search..." autocomplete="off">
      </div>

      <ul id="taskList" class="tasks"></ul>
      <p id="empty" class="empty"></p>

      <footer class="foot">
        <span id="count">0 tasks left</span>
        <button id="clearDone" class="link" type="button">Clear completed</button>
      </footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="undoBtn" type="button">Undo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
